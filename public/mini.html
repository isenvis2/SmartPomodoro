<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>⏱ 포모도로</title>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    html,body{width:220px;height:150px;overflow:hidden;background:#1a1918;color:#fff;
      font-family:system-ui,-apple-system,sans-serif;user-select:none;}
    #bar{position:fixed;top:0;left:0;right:0;height:3px;background:#2a2927}
    #fill{height:100%;width:0%;transition:width .9s linear}
    #app{display:flex;flex-direction:column;align-items:center;justify-content:center;
      height:150px;padding:8px 12px 6px;gap:2px}
    #task{font-size:10px;color:#777;max-width:180px;overflow:hidden;white-space:nowrap;
      text-overflow:ellipsis;min-height:13px}
    #time{font-size:26px;font-weight:700;letter-spacing:-1px;line-height:1}
    #phase{font-size:8px;letter-spacing:1.5px;text-transform:uppercase;opacity:.55;margin-top:1px}
    #msg{font-size:11px;color:#bbb;margin-top:3px;min-height:16px;text-align:center}
    #dots{display:flex;gap:4px;margin-top:3px;flex-wrap:wrap;justify-content:center;max-width:190px;min-height:9px}
    .dot{width:7px;height:7px;border-radius:50%;background:#2e2c2a;flex-shrink:0}
    .done{background:var(--c,#534AB7)}
    .cur{background:transparent;border:2px solid var(--c,#534AB7)}
    #idle{text-align:center;color:#444;line-height:1.7}
    #idle span{font-size:10px;color:#333}
    #play-btn{
      position:fixed;top:6px;right:6px;width:22px;height:22px;border-radius:4px;
      background:#2a2927;border:1px solid #555;color:#ccc;font-size:13px;cursor:pointer;
      display:none;align-items:center;justify-content:center;
      transition:background .15s,color .15s,border-color .15s;z-index:10;
    }
    #play-btn:hover{background:#3a3835;color:#fff;border-color:#888;}
    #play-btn:disabled{opacity:.3;cursor:default;}
  </style>
</head>
<body>
  <div id="bar"><div id="fill"></div></div>
  <div id="app"><div id="idle">⏱ 대기 중<br><span>메인 창에서 작업을 시작하세요</span></div></div>
  <button id="play-btn" title="일시정지/재생">▶</button>
<script>
const LABEL={focus:'집중',short:'짧은 휴식',long:'긴 휴식'};
const MSGS={
  focus:[[0,'집중 시작! 🎯'],[0.15,'잘 하고 있어요! 💪'],[0.40,'훌륭해요, 계속! 🔥'],
         [0.60,'조금만 더 힘내요! 😤'],[0.80,'거의 다 왔어요! 🏁'],[0.92,'마지막 스퍼트! 💨']],
  short:[[0,'잠깐 쉬어가요 ☕'],[0.5,'곧 다시 시작해요! 🌟']],
  long:[[0,'충분히 쉬어가요 😌'],[0.5,'재충전 중... 에너지 UP! ⚡']],
};
function getMsg(phase,pct,running){
  if(!running)return'일시정지 중... ⏸';
  const list=MSGS[phase]||MSGS.short;
  let m=list[0][1];
  for(const[th,txt]of list){if(pct>=th)m=txt;}
  return m;
}
function fmt(s){return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');}

function render(st){
  const app=document.getElementById('app');
  const fill=document.getElementById('fill');
  if(!st||!st.phase){
    app.innerHTML='<div id="idle">⏱ 대기 중<br><span>메인 창에서 작업을 시작하세요</span></div>';
    fill.style.width='0%';
    document.getElementById('play-btn').style.display='none';
    return;
  }
  const{running,tLeft,phase,taskName,done,total,phaseTotal,tColor}=st;
  const c=tColor||'#534AB7';
  document.documentElement.style.setProperty('--c',c);
  const pct=phaseTotal>0?Math.max(0,1-tLeft/phaseTotal):0;
  fill.style.width=(pct*100).toFixed(1)+'%';
  fill.style.background=c;
  const msg=getMsg(phase,pct,running);
  const maxD=Math.min(total,10);
  const dotsHtml=Array.from({length:maxD},(_,i)=>{
    const cl=i<done?'dot done':i===done&&phase==='focus'?'dot cur':'dot';
    return`<div class="${cl}"></div>`;
  }).join('');
  app.innerHTML=`<div id="task">${taskName||''}</div><div id="time" style="color:${c}">${fmt(tLeft)}</div><div id="phase" style="color:${c}">${LABEL[phase]||phase} &nbsp;${done}/${total}</div><div id="msg">${msg}</div><div id="dots">${dotsHtml}</div>`;
  const pb=document.getElementById('play-btn');
  pb.style.display='flex';pb.textContent=running?'⏸':'▶';
}

const bc=new BroadcastChannel('pomodoro-mini');
try{const s=localStorage.getItem('pomodoro-mini-state');if(s){render(JSON.parse(s));}}catch(e){}
bc.onmessage=e=>{if(e.data&&!e.data.type){render(e.data);}};

document.getElementById('play-btn').addEventListener('click',()=>bc.postMessage({type:'toggle-run'}));
</script>
</body>
</html>
